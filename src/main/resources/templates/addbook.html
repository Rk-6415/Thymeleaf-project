<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${book.id != null ? 'Edit Book' : 'Add Book'}">
        Add Book
    </title>
</head>

<body>

<h2 th:text="${book.id != null ? 'Edit Book' : 'Add New Book'}">
    Add New Book
</h2>

<form th:action="${book.id != null ? '/editBook/' + book.id : '/addBook'}"
      th:object="${book}"
      method="post">

    <label>Title:</label>
    <input type="text" th:field="*{title}" required>
    <br><br>

    <label>Author:</label>
    <input type="text" th:field="*{author}" required>
    <br><br>

    <label>Genre:</label>
    <input type="text" th:field="*{genre}" required>
    <br><br>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required>
    <br><br>

    <button type="submit"
            th:text="${book.id != null ? 'Update Book' : 'Add Book'}">
        Add Book
    </button>

</form>

<br>

<a th:href="@{/getBooksList}">Back to Books</a>

</body>
</html>
